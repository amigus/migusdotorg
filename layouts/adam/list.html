{{ define "main" }}
<article class="prose prose-neutral dark:prose-invert prose-headings:font-bold prose-a:text-accent prose-a:no-underline hover:prose-a:underline prose-pre:rounded-lg">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</article>

<section class="mt-14">
  <h2 class="text-2xl font-semibold tracking-tight">Posts</h2>
  <ul class="mt-6 space-y-8">
    {{- range .Pages.ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}" class="group block">
        <h3 class="text-lg font-medium leading-snug text-ink transition-colors group-hover:text-accent dark:text-neutral-100">
          {{ .Title }}
        </h3>
        {{- with .Summary }}
        <p class="mt-1.5 text-sm leading-relaxed text-muted">
          {{ . | plainify | truncate 140 }}
        </p>
        {{- end }}
      </a>
      <time datetime="{{ .Date.Format "2006-01-02" }}" class="mt-1 block text-xs font-medium uppercase tracking-wider text-neutral-400 dark:text-neutral-500">
        {{ .Date.Format "January 2006" }}
      </time>
    </li>
    {{- end }}
  </ul>
</section>
{{ end }}
